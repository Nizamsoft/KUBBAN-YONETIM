<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Güllüoğlu Kübban — Yönetim</title>
  <link rel="icon" href="https://firebasestorage.googleapis.com/v0/b/nizam--to-do.firebasestorage.app/o/company-logos%2FahknZI41JjoHGdkfyy8W%2Fphoto.jpg?alt=media&token=2b3ea8e5-90ba-4299-8cb4-5681c646baf9" />
  <!-- iOS ana ekran simgesi (Ana Ekrana Ekle) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.jpg?v=2026.74" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.jpg?v=2026.74" />
  <meta name="apple-mobile-web-app-title" content="Kübban" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#241d15" />
  <!-- Paylaşım önizlemesi (WhatsApp / sosyal) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Güllüoğlu Kübban" />
  <meta property="og:title" content="Güllüoğlu Kübban — Yönetim" />
  <meta property="og:description" content="Güllüoğlu Kübban yönetim paneli. Giriş yapmak için e-posta ve parolanızı kullanın." />
  <meta property="og:image" content="https://nizamsoft.github.io/KUBBAN-YONETIM/apple-touch-icon.jpg" />
  <meta property="og:url" content="https://nizamsoft.github.io/KUBBAN-YONETIM/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Güllüoğlu Kübban — Yönetim" />
  <meta name="twitter:description" content="Güllüoğlu Kübban yönetim paneli." />
  <meta name="twitter:image" content="https://nizamsoft.github.io/KUBBAN-YONETIM/apple-touch-icon.jpg" />
  <link rel="manifest" href="manifest.webmanifest?v=2026.196" />
  <link rel="stylesheet" href="style.css?v=2026.249" />
</head>
<body>

  <!-- Yükleniyor perdesi (açılış: logo + ilerleme çubuğu + yüzde) -->
  <div id="loader">
    <div class="loader-box">
      <img class="loader-logo" src="https://firebasestorage.googleapis.com/v0/b/nizam--to-do.firebasestorage.app/o/company-logos%2FahknZI41JjoHGdkfyy8W%2Fphoto.jpg?alt=media&token=2b3ea8e5-90ba-4299-8cb4-5681c646baf9" alt="Güllüoğlu Kübban" />
      <div class="loader-name">Güllüoğlu Kübban</div>
      <div class="loader-sub">Yönetim Paneli</div>
      <div class="loader-track indet"><div class="loader-fill" id="loader-fill"></div></div>
      <div class="loader-pct" id="loader-pct"></div>
      <div class="loader-msg" id="loader-msg">Başlatılıyor…</div>
    </div>
  </div>

  <!-- ===================== GİRİŞ EKRANI ===================== -->
  <div id="login-view" class="hidden">
    <div class="login-card">
      <img class="logo" src="https://firebasestorage.googleapis.com/v0/b/nizam--to-do.firebasestorage.app/o/company-logos%2FahknZI41JjoHGdkfyy8W%2Fphoto.jpg?alt=media&token=2b3ea8e5-90ba-4299-8cb4-5681c646baf9" alt="Güllüoğlu Kübban" />
      <h1>Güllüoğlu Kübban</h1>
      <div class="sub">Yönetim Paneli</div>

      <form id="login-form">
        <div class="field">
          <label for="email">E-posta</label>
          <input type="email" id="email" autocomplete="email" placeholder="ornek@gulluoglukubban.com" required />
        </div>
        <div class="field">
          <label for="password">Parola</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <div class="auth-error" id="auth-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Giriş Yap</button>
      </form>

      <div class="login-foot">
        <div class="ns-logo" aria-label="Nizam Software">
          <div class="rays"></div>
          <div class="core"></div>
          <div class="ring"></div>
          <div class="ring r2"></div>
          <span class="p" style="--dx:34px;--dy:0px;background:#c9a24b;box-shadow:0 0 6px #c9a24b"></span>
          <span class="p" style="--dx:34px;--dy:24.7px;background:#e0281e;box-shadow:0 0 6px #e0281e"></span>
          <span class="p" style="--dx:15.5px;--dy:47.6px;background:#fff;box-shadow:0 0 6px #fff"></span>
          <span class="p" style="--dx:-10.5px;--dy:32.3px;background:#f0b84d;box-shadow:0 0 6px #f0b84d"></span>
          <span class="p" style="--dx:-34px;--dy:24.7px;background:#e0281e;box-shadow:0 0 6px #e0281e"></span>
          <span class="p" style="--dx:-50px;--dy:0px;background:#fff;box-shadow:0 0 6px #fff"></span>
          <span class="p" style="--dx:-27.5px;--dy:-20px;background:#c9a24b;box-shadow:0 0 6px #c9a24b"></span>
          <span class="p" style="--dx:-13px;--dy:-39.9px;background:#ff6a4d;box-shadow:0 0 6px #ff6a4d"></span>
          <span class="p" style="--dx:15.5px;--dy:-47.6px;background:#c9a24b;box-shadow:0 0 6px #c9a24b"></span>
          <span class="p" style="--dx:27.5px;--dy:-20px;background:#e0281e;box-shadow:0 0 6px #e0281e"></span>
          <div class="glint"></div>
          <img class="ns-art" src="nizamsoft-logo.png?v=2026.190" alt="Nizam Software"
               onerror="this.style.display='none';var f=this.parentNode.querySelector('.ns-fallback');if(f)f.style.display='block';" />
          <svg class="ns-art ns-fallback" style="display:none" viewBox="0 0 104 116" xmlns="http://www.w3.org/2000/svg" role="img">
            <defs>
              <linearGradient id="ns-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0402c"/><stop offset=".28" stop-color="#c31c12"/><stop offset=".62" stop-color="#7d0f0a"/><stop offset="1" stop-color="#160406"/></linearGradient>
              <linearGradient id="ns-redTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a4d"/><stop offset="1" stop-color="#e23320"/></linearGradient>
              <linearGradient id="ns-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e6ea"/><stop offset=".5" stop-color="#b9b9c0"/><stop offset="1" stop-color="#86868d"/></linearGradient>
              <linearGradient id="ns-black" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#050506"/></linearGradient>
              <linearGradient id="ns-rleg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a51"/><stop offset=".5" stop-color="#2a2a2f"/><stop offset="1" stop-color="#0e0e11"/></linearGradient>
              <linearGradient id="ns-rbev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfcfd5"/><stop offset="1" stop-color="#7f7f86"/></linearGradient>
              <filter id="ns-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1.2" dy="3" stdDeviation="2.4" flood-color="#000" flood-opacity="0.26"/></filter>
            </defs>
            <g filter="url(#ns-sh)">
              <polygon points="20,24 40,24 40,98 20,98" fill="url(#ns-red)"/>
              <polygon points="20,24 40,24 33,34 20,40" fill="url(#ns-redTop)"/>
              <polygon points="36,24 40,24 40,98 36,98" fill="#3a0a08" opacity=".55"/>
              <polygon points="40,24 64,72 64,82 40,34" fill="url(#ns-silver)"/>
              <polygon points="40,34 64,82 64,92 40,44" fill="url(#ns-black)"/>
              <polygon points="40,33 64,81 64,82.6 40,34.6" fill="#f2f2f5" opacity=".5"/>
              <polygon points="64,24 84,24 84,98 64,98" fill="url(#ns-rleg)"/>
              <polygon points="64,24 69,24 69,98 64,98" fill="url(#ns-rbev)"/>
              <polygon points="64,24 84,24 79,31 69,31" fill="#5a5a61"/>
            </g>
          </svg>
        </div>
        <div class="ns-cred">
          Bu program <b>Nizam Soft — Kerem Güllü</b> tarafından yazılmıştır.<br>© Tüm hakları saklıdır.
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== UYGULAMA ===================== -->
  <div id="app-view" class="hidden">
    <!-- Yan menü -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="https://firebasestorage.googleapis.com/v0/b/nizam--to-do.firebasestorage.app/o/company-logos%2FahknZI41JjoHGdkfyy8W%2Fphoto.jpg?alt=media&token=2b3ea8e5-90ba-4299-8cb4-5681c646baf9" alt="logo" />
        <div class="name">Güllüoğlu Kübban<small>Gaziantep Mutfağı</small></div>
      </div>
      <nav class="nav" id="nav"><!-- JS ile doldurulur --></nav>
      <div class="sidebar-foot">© Nizam Soft — Kerem Güllü</div>
    </aside>

    <!-- İçerik -->
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menu-toggle" aria-label="Menü">☰</button>
        <button class="page-back" id="page-back" aria-label="Geri" title="Geri" style="display:none">←</button>
        <div>
          <div class="crumb" id="crumb">Ana Sayfa</div>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="spacer"></div>
        <div class="user-chip" id="user-chip" title="Çıkış için tıklayın">
          <div class="avatar" id="user-avatar">?</div>
          <div class="meta">
            <b id="user-name">—</b>
            <span class="role-badge" id="user-role">kullanıcı</span>
          </div>
        </div>
      </header>

      <main class="content" id="view-container"><!-- Görünümler JS ile render edilir --></main>
    </div>

    <!-- Mobil alt gezinme çubuğu (yalnız telefonda görünür; JS ile doldurulur) -->
    <nav id="bottom-nav" aria-label="Alt menü"></nav>
  </div>

  <!-- Mobil menü arka planı (overlay) -->
  <div id="sidebar-overlay"></div>

  <!-- Modal & toast konteynerları -->
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script type="module" src="app.js?v=2026.249"></script>
</body>
</html>
